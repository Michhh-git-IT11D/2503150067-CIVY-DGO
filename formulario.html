<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIVY DGO - Formulario</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="hero-banner">
        <div class="hero-content">
            <h1>CIVY DGO</h1>
        </div>
    </div>

    <!-- contenido principal -->
    <div class="main-content">
        <h2>Formulario de Reporte</h2>
        <p>Llena tus datos a continuación y nos pondremos en contacto contigo.</p>

        <form id="miFormulario">
        
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>
        

        
            <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad" required>
        

        
            <label for="mensaje">Mensaje o Reporte:</label>
            <textarea id="mensaje" name="mensaje" rows="4" required></textarea>


        <button type="submit" class="btn">Enviar Información</button>
</form>

<p id="resultado" style="margin-top: 15px; font-weight: bold; color: #10b981; text-align: center;"></p>

        <!-- enlaces para regresar -->
        <div class="botones-opciones" style="margin-top: 20px;">
            <a href="index.html" class="btn-secundario"> Volver al Inicio</a>
            <a href="contacto.html" class="btn-secundario">Ir a Contacto</a>
            <a href="masInfo.html" class="btn-dspSec">Más Informacion</a>
        </div>
    </div>

    <script src="js/scripts.js"></script>
</body>
</html>
